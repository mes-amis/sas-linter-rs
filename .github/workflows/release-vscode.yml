name: Release VSCode Extension

on:
  push:
    tags:
      - "vscode-v[0-9]*"
  # Dispatched by the CI tag job: tags pushed with GITHUB_TOKEN don't fire
  # on:push workflows, so it triggers this workflow explicitly with the tag ref.
  workflow_dispatch:

jobs:
  publish:
    name: package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Package
        run: npx vsce package --skip-license
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: VSCode extension ${{ github.ref_name }}
          files: editors/vscode/*.vsix
          generate_release_notes: true
