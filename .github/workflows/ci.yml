name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --all

  tag:
    name: tag release
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag new version and trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tag="v${version}"
          if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
          # Tags pushed with GITHUB_TOKEN don't fire on:push workflows,
          # so dispatch the release workflow directly at the tag ref.
          gh workflow run release.yml --ref "${tag}"
      - name: Tag new VSCode extension version and trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version editors/vscode/package.json)"
          tag="vscode-v${version}"
          if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
          gh workflow run release-vscode.yml --ref "${tag}"
