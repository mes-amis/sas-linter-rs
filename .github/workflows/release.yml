name: Release

on:
  push:
    tags:
      - "v[0-9]*"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compile tooling
        if: contains(matrix.target, 'linux-musl')
        run: |
          cargo install --locked cross
      - name: Build (cross, for musl)
        if: contains(matrix.target, 'linux-musl')
        run: cross build --release --target ${{ matrix.target }}
      - name: Build (cargo, for darwin)
        if: contains(matrix.target, 'darwin')
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        run: |
          mkdir -p dist
          name="sas-lint-${{ github.ref_name }}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/sas-lint" "dist/${name}"
          (cd dist && shasum -a 256 "${name}" > "${name}.sha256")
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sas-lint-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
