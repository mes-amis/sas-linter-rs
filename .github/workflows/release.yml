name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  # Dispatched by the CI tag job: tags pushed with GITHUB_TOKEN don't fire
  # on:push workflows, so it triggers this workflow explicitly with the tag ref.
  workflow_dispatch:

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compile tooling
        if: contains(matrix.target, 'linux-musl')
        run: |
          cargo install --locked cross
      - name: Build (cross, for musl)
        if: contains(matrix.target, 'linux-musl')
        run: cross build --release --target ${{ matrix.target }}
      - name: Build (cargo, for darwin and windows)
        if: ${{ !contains(matrix.target, 'linux-musl') }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          name="sas-lint-${{ github.ref_name }}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/sas-lint"
          case "${{ matrix.target }}" in
            *windows*) bin="${bin}.exe"; name="${name}.exe" ;;
          esac
          cp "${bin}" "dist/${name}"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${name}" > "${name}.sha256"
          else
            shasum -a 256 "${name}" > "${name}.sha256"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sas-lint-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
